services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: comparador
      POSTGRES_PASSWORD: comparador
      POSTGRES_DB: comparador
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comparador -d comparador"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://comparador:comparador@db:5432/comparador
      ADMIN_TOKEN: dev-admin-token
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata: